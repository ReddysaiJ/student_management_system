<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" type="text/css" href="styles/style1.css" />
</head>
<body>
    <div>
        <nav>
            <a href="index.html">Home</a> &nbsp;
            <a href="login.html">Login</a> &nbsp;
            <a href="register.html">Register</a>
        </nav>
    </div>
    <div style="text-align: center" class="formDiv">
        <h3>Register TO Student Management System</h3>
        <form onsubmit="register(event)">
            <p id="error" style="color: orange;"></p>
            <label for="rollNumber">Roll Number :</label>
            <input type="text" id="rollNumber" placeholder="roll number" required>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="E-mail" required>

            <label for="password">Password:</label>
            <input type="password" id="password" required placeholder="password">

            <label for="confirmPassword">Re-Type Password:</label>
            <input type="password" id="confirmPassword" required placeholder="password">
            <button type="submit">Register</button>
            <p>go to <a href="login.html">Login</a></p>
        </form>
    </div>
    
    <script src="register.js"></script>
</body>
</html>
